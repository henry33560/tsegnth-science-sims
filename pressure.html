<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>大氣壓力實驗室 </title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body { display: flex; flex-direction: column; align-items: center; font-family: "微軟正黑體", sans-serif; margin: 0; padding: 10px; background-color: #f4f7f6; }
    .controls { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 10px; width: 95%; max-width: 650px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);}
    .row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .control-group { display: flex; flex-direction: column; gap: 5px; background: #f8f9fa; padding: 10px; border-radius: 5px; flex: 1; min-width: 150px;}
    label { font-weight: bold; color: #2c3e50; font-size: 14px; }
    select, input[type="range"] { cursor: pointer; padding: 3px; }
  </style>
</head>
<body>

  <div class="controls">
    <div class="row">
      <div class="control-group">
        <label>教學情境切換：</label>
        <select id="modeSelect" onchange="changeMode()">
          <option value="0">1. 托里切利實驗 (Torricelli)</option>
          <option value="1">2. 馬德堡半球實驗 (Magdeburg)</option>
        </select>
      </div>

      <div class="control-group" id="tCtrl1">
        <label>外界大氣壓力：<span id="atmVal">1.0</span> atm</label>
        <input type="range" id="atmSlider" min="0.5" max="1.5" step="0.1" value="1.0">
      </div>
      <div class="control-group" id="tCtrl2">
        <label>管子傾斜角度：<span id="angleVal">0</span> 度</label>
        <input type="range" id="angleSlider" min="0" max="65" step="1" value="0">
      </div>
      <div class="control-group" id="tCtrl3">
        <label>替換實驗液體：</label>
        <select id="liquidSelect">
          <option value="13.6">水銀 (密度 13.6)</option>
          <option value="1.0">水 (密度 1.0)</option>
        </select>
      </div>

      <div class="control-group" id="mCtrl1" style="display:none;">
        <label>半球半徑 r = <span id="rVal">20</span> cm</label>
        <input type="range" id="rSlider" min="10" max="40" step="1" value="20">
      </div>
      <div class="control-group" id="mCtrl2" style="display:none;">
        <label>內部剩餘氣壓 = <span id="vacVal">0.0</span> atm</label>
        <input type="range" id="vacSlider" min="0.0" max="1.0" step="0.1" value="0.0">
      </div>
      <div class="control-group" id="mCtrl3" style="display:none;">
        <label>左右總拉力 F = <span id="pullVal">0</span> kgw</label>
        <input type="range" id="pullSlider" min="0" max="3500" step="50" value="0">
      </div>
    </div>
  </div>

  <script>
    let currentMode = 0;

    function setup() {
      createCanvas(600, 480);
      angleMode(DEGREES);
    }

    function changeMode() {
      currentMode = parseInt(document.getElementById('modeSelect').value);
      let tShow = currentMode === 0 ? 'flex' : 'none';
      let mShow = currentMode === 1 ? 'flex' : 'none';
      document.getElementById('tCtrl1').style.display = tShow;
      document.getElementById('tCtrl2').style.display = tShow;
      document.getElementById('tCtrl3').style.display = tShow;
      document.getElementById('mCtrl1').style.display = mShow;
      document.getElementById('mCtrl2').style.display = mShow;
      document.getElementById('mCtrl3').style.display = mShow;
    }

    function draw() {
      background(250);
      if (currentMode === 0) drawTorricelli();
      else if (currentMode === 1) drawMagdeburg();
    }

    // ==========================================
    // 托里切利實驗修復版 (完美水平液面與對齊)
    // ==========================================
    function drawTorricelli() {
      let atm = parseFloat(document.getElementById('atmSlider').value);
      let angle = parseFloat(document.getElementById('angleSlider').value);
      let d = parseFloat(document.getElementById('liquidSelect').value);
      document.getElementById('atmVal').innerText = atm.toFixed(1);
      document.getElementById('angleVal').innerText = angle;

      let isWater = (d === 1.0);
      let h_cm = (atm * 1033.6) / d; // 垂直高度
      let pxPerCm = 3.5; // 比例尺 1cm = 3.5px
      let h_px = h_cm * pxPerCm;
      
      let basinY = 400; // 水槽液面 Y 座標
      let tubeLen_px = 350; // 玻璃管總長
      let tubeDiameter = 26;
      let target_y = basinY - h_px; // 內部水銀面目標 Y 座標 (完美水平)

      // 1. 畫水槽 (半透明)
      fill(isWater ? color(135, 206, 235, 150) : color(180, 180, 180, 150));
      stroke(50); strokeWeight(2);
      rect(150, basinY, 300, 70); 

      // 2. 畫托里切利實驗核心
      push();
      // 以管口沒入水中的位置為中心
      translate(300, basinY + 20); 

      // --- 完美水平液面的終極解法：使用 Clip (剪裁路徑) ---
      // 步驟A: 儲存原本的畫布狀態
      drawingContext.save(); 

      // 步驟B: 設定管子的傾斜區域作為餅乾模具 (Clip Path)
      push(); 
      rotate(angle);
      drawingContext.beginPath();
      // 在管子內部建立裁切區域 (往下延伸入水槽，確保底部完美填充)
      drawingContext.rect(-tubeDiameter/2 + 2, 30, tubeDiameter - 4, -tubeLen_px - 30);
      drawingContext.clip(); // 啟動裁切模式
      pop(); // 恢復管子的旋轉座標系 (回到直立座標)

      // 步驟C: 在絕對直立的座標系中，畫一個絕對水平且足夠大的液體方塊
      fill(isWater ? color(135, 206, 235) : color(180, 180, 180));
      noStroke();
      // Y座標從目標水平面往下畫 (畫布很大不用怕破圖)，X座標畫超大
      // 從絕對液面 Y = -target_y (因為 translate 到 basinY) 開始畫
      rect(-tubeLen_px, 30, tubeLen_px * 2, -h_px - 30);
      
      // 步驟D: 恢復原本畫布狀態 (取消裁切)
      drawingContext.restore(); 
      // ----------------------------------------------------

      // 3. 畫管子外框 (蓋在裁切液體之上)
      push();
      rotate(angle);
      stroke(50); strokeWeight(3); fill(255, 255, 255, 50); // 半透明玻璃
      // 玻璃管矩形 (向下入水槽 30px)
      rect(-tubeDiameter/2, 30, tubeDiameter, -tubeLen_px - 30); 
      
      // 在直角座標系畫標示文字 (自動隨著角度垂直於管子，這沒關係)
      // 只有在非滿管且非水時才畫真空
      let tubeVerticalH = tubeLen_px * cos(angle);
      if (h_px < tubeVerticalH && !isWater) {
        fill(50); noStroke(); textAlign(CENTER); textSize(14);
        let currentSlantH = (h_px / cos(angle)); // 內部液體斜長
        text("托里切利\n真空", 0, (-tubeLen_px - currentSlantH)/2 + 10);
      }
      pop(); // 結束管子旋轉 push

      pop(); // 結束 translate push

      // 4. 畫水平輔助線與垂直高度 (完美對齊)
      stroke(220, 30, 30); strokeWeight(2); drawingContext.setLineDash([5, 5]);
      // 液面基準線
      line(100, basinY, 500, basinY); 
      
      if (isWater) {
        fill(220, 30, 30); noStroke(); textAlign(CENTER); textSize(20);
        text("⚠️ 水柱高度需達 10.33 公尺，管子太短直接滿管！", 300, 100);
      } else {
        // 管內完美對齊線
        line(150, target_y, 450, target_y); 
        drawingContext.setLineDash([]);
        
        // 標示垂直高度 h (完美對齊頂端與底部)
        drawDimension(250, basinY, 250, target_y, `h = ${(h_px/pxPerCm).toFixed(1)} cm`);
        
        // 公式
        fill(0); noStroke(); textAlign(LEFT); textSize(16);
        text(`外界大氣壓力 = 內部液柱壓力\nP = h × d = ${(h_px/pxPerCm).toFixed(1)} × 13.6 ≈ ${(atm*1033.6).toFixed(0)} gw/cm²`, 20, 30);
      }
      drawingContext.setLineDash([]);
    }

    // ==========================================
    // 馬德堡半球實驗 (維持原樣)
    // ==========================================
    function drawMagdeburg() {
      let r = parseFloat(document.getElementById('rSlider').value);
      let pInt = parseFloat(document.getElementById('vacSlider').value);
      let pull = parseFloat(document.getElementById('pullSlider').value);
      
      document.getElementById('rVal').innerText = r;
      document.getElementById('vacVal').innerText = pInt.toFixed(1);
      document.getElementById('pullVal').innerText = pull;

      let pExt = 1.0; 
      let deltaP_atm = pExt - pInt;
      let deltaP_kgw = deltaP_atm * 1.0336; 
      let area = PI * r * r; 
      let fAtm = deltaP_kgw * area; 
      let isSplit = pull > fAtm;
      let gap = isSplit ? map(pull - fAtm, 0, 1000, 10, 100) : 0; // 拉開距離隨力增加

      let cx = 300, cy = 250;
      let visualR = r * 3;

      stroke(100); strokeWeight(4);
      line(cx - visualR - gap, cy, cx - visualR - gap - 100, cy);
      line(cx + visualR + gap, cy, cx + visualR + gap + 100, cy);

      noStroke(); fill(180, 140, 50); // 銅色
      arc(cx - gap, cy, visualR*2, visualR*2, 90, 270, CHORD);
      arc(cx + gap, cy, visualR*2, visualR*2, -90, 90, CHORD);
      
      stroke(220, 30, 30); fill(220, 30, 30); strokeWeight(3);
      for(let a = 0; a < 360; a += 45) {
        let os = cos(a) < 0 ? -gap : gap;
        drawArrow(cx + cos(a)*(visualR+30) + os, cy + sin(a)*(visualR+30), cx + cos(a)*visualR + os, cy + sin(a)*visualR, 8);
      }

      fill(0); noStroke(); textAlign(LEFT); textSize(16);
      text(`截面積 A = πr² ≈ ${area.toFixed(0)} cm²`, 20, 30);
      textSize(18); text(`大氣總壓力 F ≈ ${fAtm.toFixed(0)} kgw`, 20, 60);

      textAlign(CENTER); textSize(24);
      if (deltaP_atm === 0) { fill(100); text("內外氣壓平衡，半球會自然分開", cx, cy + visualR + 80); }
      else if (isSplit) { fill(39, 174, 96); text(`✅ 成功拉開！(拉力 ${pull} ≥ 大氣壓力 ${fAtm.toFixed(0)})`, cx, cy + visualR + 80); }
      else { fill(192, 57, 43); text(`❌ 拉不開！(拉力 ${pull} < 大氣壓力 ${fAtm.toFixed(0)})`, cx, cy + visualR + 80); }
    }

    function drawDimension(x1, y1, x2, y2, txt) {
      stroke(0); strokeWeight(1);
      line(x1, y1, x2, y2);
      line(x1-5, y1, x1+5, y1); line(x2-5, y2, x2+5, y2);
      noStroke(); fill(0); textAlign(CENTER); text(txt, (x1+x2)/2 - 30, (y1+y2)/2);
    }

    function drawArrow(x1, y1, x2, y2, headSize) {
      line(x1, y1, x2, y2);
      push(); translate(x2, y2);
      let a = atan2(y1-y2, x1-x2); rotate(a);
      line(0, 0, headSize, -headSize/2); line(0, 0, headSize, headSize/2); pop();
    }
  </script>
</body>
</html>
