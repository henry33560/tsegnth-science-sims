<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自然科虛擬實驗室</title>
    <style>
        /* CSS 區塊：美化網頁排版 */
        body { font-family: "微軟正黑體", sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background-color: #f4f7f6; }
        header { background-color: #2c3e50; color: white; padding: 15px 20px; text-align: center; letter-spacing: 2px; }
        .container { display: flex; flex: 1; overflow: hidden; }
        
        /* 左側選單設計 */
        .sidebar { width: 240px; background-color: #ffffff; padding: 20px; overflow-y: auto; border-right: 1px solid #ddd; box-shadow: 2px 0 5px rgba(0,0,0,0.05); }
        .sidebar h3 { color: #16a085; margin-top: 15px; margin-bottom: 5px; border-bottom: 2px solid #16a085; padding-bottom: 5px; }
        .sidebar ul { list-style-type: none; padding: 0; margin: 0; }
        .sidebar li { margin-bottom: 5px; }
        
        /* 新增：主選單按鈕樣式 (例如：八上、八下) */
        .menu-btn { text-decoration: none; color: #2c3e50; display: block; padding: 8px; border-radius: 5px; transition: 0.3s; font-size: 16px; font-weight: bold; cursor: pointer; }
        .menu-btn:hover { background-color: #e8f8f5; color: #16a085; }
        
        /* 新增：子選單樣式 (預設先隱藏，並往右縮排) */
        .submenu { display: none; padding-left: 20px; margin-top: 5px; border-left: 2px solid #ecf0f1; margin-left: 10px;}
        .submenu a { text-decoration: none; color: #555; display: block; padding: 6px 8px; border-radius: 5px; transition: 0.3s; font-size: 14px; cursor: pointer; }
        .submenu a:hover { background-color: #ecf0f1; color: #2980b9; }
        
        /* 右側主要內容區 */
        .content { flex: 1; padding: 25px; display: flex; flex-direction: column; }
        #sim-title { color: #2c3e50; margin-top: 0; }
        .simulation-container { flex: 1; border: 2px dashed #bdc3c7; border-radius: 10px; display: flex; justify-content: center; align-items: center; background-color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden;}
        
        /* 用來嵌入動畫的 iframe */
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <header>
        <h1>🔬 自然科互動虛擬實驗室</h1>
    </header>

    <div class="container">
        <nav class="sidebar">
            <h3>國中理化</h3>
            <ul>
                <li>
                    <div class="menu-btn" onclick="toggleSubMenu('grade8-up')">📂 八上：波動與聲音 ▾</div>
                    <ul id="grade8-up" class="submenu">
                        <li><a onclick="loadSim('wave')">1. 波的傳播</a></li>
                        <li><a onclick="loadSim('sound')">2. 聲音的反射 (建置中)</a></li>
                    </ul>
                </li>
                
                <li>
                    <div class="menu-btn" onclick="toggleSubMenu('grade8-down')">📂 八下：力與壓力 ▾</div>
                    <ul id="grade8-down" class="submenu">
                        <li><a onclick="loadSim('pressure')">1. 靜止液體壓力</a></li>
                        <li><a onclick="loadSim('atm_pressure')">2. 大氣壓力 </a></li> 
                        <li><a onclick="loadSim('buoyancy')">3. 浮力原理 (建置中)</a></li>
                    </ul>
                </li>
            </ul>
            
            <h3>高中物理</h3>
            <ul>
                <li>
                    <div class="menu-btn" onclick="toggleSubMenu('shs-phy-2')">📂 高二：力學 ▾</div>
                    <ul id="shs-phy-2" class="submenu">
                        <li><a onclick="loadSim('projectile')">1. 平拋運動 (建置中)</a></li>
                    </ul>
                </li>
            </ul>

            <h3>高中地科</h3>
            <ul>
                 <li>
                    <div class="menu-btn" onclick="toggleSubMenu('shs-earth-1')">📂 高一：天文 ▾</div>
                    <ul id="shs-earth-1" class="submenu">
                        <li><a onclick="loadSim('astro')">1. 天球與星空 (建置中)</a></li>
                    </ul>
                </li>
            </ul>
        </nav>

        <main class="content">
            <h2 id="sim-title">歡迎來到虛擬實驗室</h2>
            <p id="sim-desc">請從左側選單選擇一個單元來進行互動模擬。</p>
            
            <div class="simulation-container">
                <iframe id="sim-frame" src="" style="display: none;"></iframe>
            </div>
        </main>
    </div>

    <script>
        // 新增的函數：用來控制子選單的展開與收合
        function toggleSubMenu(menuId) {
            const menu = document.getElementById(menuId);
            // 如果目前是隱藏的，就把它顯示出來；反之則隱藏
            if (menu.style.display === "none" || menu.style.display === "") {
                menu.style.display = "block";
            } else {
                menu.style.display = "none";
            }
        }

        // 原本的函數：用來切換動畫與標題
        function loadSim(unit) {
            const title = document.getElementById('sim-title');
            const desc = document.getElementById('sim-desc');
            const frame = document.getElementById('sim-frame');

            frame.style.display = 'block';

           if (unit === 'pressure') {
                title.innerText = '靜止液體壓力與深度的關係';
                desc.innerText = '【操作說明】點擊探測器後，使用鍵盤方向鍵平滑移動。(公式: P = h × d)';
                frame.src = './pressure.html?v=5'; // 順便更新液體壓力的快取
            } else if (unit === 'atm_pressure') {
                title.innerText = '大氣壓力：托里切利與馬德堡半球';
                desc.innerText = '【操作說明】觀察傾斜對水銀柱垂直高度的影響，並挑戰拉開馬德堡半球！';
                frame.src = './atm_pressure.html?v=1'; // 指向您剛剛建立的新檔案
            } else if (unit === 'wave') {
                title.innerText = '波的傳播與介質';
                desc.innerText = '觀察橫波與縱波中，介質粒子的運動情形。';
                frame.src = 'https://phetsims.colorado.edu/sims/html/wave-on-a-string/latest/wave-on-a-string_zh_TW.html';
            } else {
                title.innerText = '建置中...';
                desc.innerText = '老師正在努力撰寫程式碼中，敬請期待！';
                frame.style.display = 'none';
            }
        }
    </script>
</body>
</html>
