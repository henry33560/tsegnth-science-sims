<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自然科學虛擬實驗室</title>
    <style>
        body { font-family: "微軟正黑體", sans-serif; margin: 0; display: flex; height: 100vh; background-color: #f0f2f5; }
        #sidebar { width: 280px; background-color: #2c3e50; color: white; padding: 20px; overflow-y: auto; flex-shrink: 0; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        #main-content { flex-grow: 1; display: flex; flex-direction: column; padding: 20px; gap: 15px; background-color: #fff; }
        h1 { font-size: 1.5rem; margin-bottom: 20px; border-bottom: 2px solid #34495e; padding-bottom: 10px; }
        .menu-btn { width: 100%; padding: 12px; margin: 5px 0; background: none; border: none; color: white; text-align: left; cursor: pointer; font-size: 1rem; border-radius: 5px; transition: 0.3s; }
        .menu-btn:hover { background-color: #34495e; }
        .submenu { list-style: none; padding-left: 20px; display: none; margin: 5px 0; }
        .submenu li a { color: #bdc3c7; text-decoration: none; display: block; padding: 8px 0; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
        .submenu li a:hover { color: #3498db; }
        #sim-container { flex-grow: 1; border: 2px dashed #ddd; border-radius: 10px; overflow: hidden; background-color: #fafafa; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .info-panel { background: #e8f4fd; padding: 15px; border-left: 5px solid #3498db; border-radius: 4px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h1>🔬 虛擬實驗室</h1>
    
    <div>
        <button class="menu-btn" onclick="toggleSubMenu('grade8-down')">📂 八下：力與壓力 ▾</button>
        <ul id="grade8-down" class="submenu" style="display: block;">
            <li><a onclick="loadSim('pressure')">1. 靜止液體壓力</a></li>
            <li><a onclick="loadSim('atm_pressure')">2. 大氣壓力</a></li>
            <li><a onclick="loadSim('buoyancy')">3. 浮力原理</a></li>
        </ul>
    </div>
</div>

<div id="main-content">
    <div class="info-panel">
        <h2 id="sim-title" style="margin-top:0;">歡迎來到虛擬實驗室</h2>
        <p id="sim-desc">請從左側選單選擇一個實驗單元開始操作。</p>
    </div>
    
    <div id="sim-container">
        <iframe id="sim-frame" src="about:blank"></iframe>
    </div>
</div>

<script>
    function toggleSubMenu(id) {
        const menu = document.getElementById(id);
        menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }

    function loadSim(unit) {
        const frame = document.getElementById('sim-frame');
        const title = document.getElementById('sim-title');
        const desc = document.getElementById('sim-desc');
        
        // 使用 Date.now() 徹底解決快取問題
        const version = Date.now();

        if (unit === 'pressure') {
            title.innerText = '靜止液體壓力與深度的關係';
            desc.innerText = '【操作說明】點擊探測器後，可使用鍵盤方向鍵長按平滑移動。觀察 P = h × d 的關係。';
            frame.src = './pressure.html?v=' + version;
        } else if (unit === 'atm_pressure') {
            title.innerText = '大氣壓力：托里切利與馬德堡半球';
            desc.innerText = '【操作說明】觀察管子傾斜時垂直高度的恆定性，並挑戰拉開馬德堡半球。';
            frame.src = './atm_pressure.html?v=' + version;
        } else if (unit === 'buoyancy') {
            title.innerText = '浮力綜合實驗室';
            desc.innerText = '【操作說明】包含視重變化、阿基米德原理、冰塊融化迷思及貨船吃水線等情境。';
            frame.src = './buoyancy.html?v=' + version;
        }
    }
</script>

</body>
</html>
